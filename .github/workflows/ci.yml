name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      # - name: Audit dependencies
      #   run: npm audit

      - name: Run linter
        run: npm run lint

      - name: Run prettier
        run: npm run prettier -- --check

      - name: Start backend
        run: npm run start:test > "$RUNNER_TEMP/backend.log" 2>&1 &

      - name: Wait for backend to start
        run: |
          LOG_FILE="$RUNNER_TEMP/backend.log"
          EXPECTED='LOG [IndexerService] [accountId: 2 rootPathId: 4] adding folder'
          for i in $(seq 1 120); do
            if sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' "$LOG_FILE" 2>/dev/null |
              grep -Fq "$EXPECTED"; then
              echo "Backend startup message detected"
              exit 0
            fi
            echo "Waiting for backend startup message... attempt $i/120"
            sleep 1
          done
          echo "Backend did not emit the expected startup message within 120 seconds"
          exit 1

      - name: Run tests
        run: npm run test

      - name: Backend debugging logs
        if: failure()
        shell: bash
        continue-on-error: true
        run: |
          if [ -f "$RUNNER_TEMP/backend.log" ]; then
            tail -n 200 "$RUNNER_TEMP/backend.log" || true
          else
            echo "No backend.log found at $RUNNER_TEMP/backend.log"
          fi
